    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const colors = {
        success: "bg-teal-600 text-white border-teal-500",
        error: "bg-rose-600 text-white border-rose-500",
        warning: "bg-amber-500 text-white border-amber-400",
        info: "bg-slate-800 text-white border-slate-700"
      };
      const icons = {
        success: "check-circle-2",
        error: "alert-circle",
        warning: "alert-triangle",
        info: "info"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium fade-in ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons({ nodes: [toast] });

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        toast.style.transition = "all 0.25s ease";
        setTimeout(() => toast.remove(), 250);
      }, 3400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function generateId(prefix = "id") {

    function compressImageFile(file, maxWidth = 300, maxHeight = 300, quality = 0.82) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("File harus berupa gambar (JPG, PNG, atau WEBP)."));
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const outputType = file.type === "image/png" ? "image/png" : "image/jpeg";
            const dataUrl = canvas.toDataURL(outputType, quality);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error("Gagal memproses gambar."));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // 7. SINKRONISASI REAL-TIME FIRESTORE (SAAT IS_PREVIEW === false)
    // =========================================================================
    function clearFirestoreListeners() {
      unsubscribers.forEach((unsub) => {
        try { unsub(); } catch (_) {}
      });
      unsubscribers = [];
    }

    function startFirestoreSync() {
      if (IS_PREVIEW || !db) return;
      clearFirestoreListeners();

      unsubscribers.push(
        onSnapshot(
          collection(db, "pengaturan_sekolah"),
          (snap) => {
            if (!snap.empty) {
              const firstDoc = snap.docs[0];
              state.pengaturan_sekolah = { id: firstDoc.id, ...firstDoc.data() };
            }
            renderApp();
          },
          (err) => console.error("Error sync pengaturan_sekolah:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "master_periode"),
          (snap) => {
            state.master_periode = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            const activeP = state.master_periode.find((p) => p.is_active);
            if (activeP) {
              state.filter.jenis_penilaian = activeP.jenis_penilaian;
              state.filter.semester = activeP.semester;
              state.filter.tahun_pelajaran = activeP.tahun_pelajaran;
            }
            renderApp();
          },
          (err) => console.error("Error sync master_periode:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "users_panitia"),
          (snap) => {
            state.users_panitia = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderApp();
          },
          (err) => console.error("Error sync users_panitia:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "ruang_ujian"),
          (snap) => {
            state.ruang_ujian = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderApp();
          },
          (err) => console.error("Error sync ruang_ujian:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "peserta_ujian"),
          (snap) => {
            state.peserta_ujian = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderApp();
          },
          (err) => console.error("Error sync peserta_ujian:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "jadwal_ujian"),
          (snap) => {
            state.jadwal_ujian = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderApp();
          },
          (err) => console.error("Error sync jadwal_ujian:", err)
        )
      );

      unsubscribers.push(
        onSnapshot(
          collection(db, "berita_acara"),
          (snap) => {
            state.berita_acara = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderApp();
          },
          (err) => console.error("Error sync berita_acara:", err)
        )
      );
    }

    if (!IS_PREVIEW && auth) {
      onAuthStateChanged(auth, (user) => {
        state.authLoading = false;
        if (user) {
          state.currentUser = {
            role: "admin",
            id: user.uid,
            name: user.displayName || "Admin Panitia Utama",
            emailOrUsername: user.email,
            nip: "Administrator"
          };
          startFirestoreSync();
        } else if (state.currentUser?.role === "admin") {
          state.currentUser = null;
          clearFirestoreListeners();
        }
        renderApp();
      });
    } else {
      state.authLoading = false;
    }

    // =========================================================================
    // 8. LAPISAN DATA CRUD DUAL-MODE
    // =========================================================================
    async function saveDocument(colName, payload, docId = null) {
      if (IS_PREVIEW) {
        if (colName === "pengaturan_sekolah") {
          state.pengaturan_sekolah = { ...state.pengaturan_sekolah, ...payload, id: "profil_utama" };
          renderApp();
          return "profil_utama";
        }
        const list = state[colName];
        if (!Array.isArray(list)) return null;
        if (docId) {
          const idx = list.findIndex((item) => item.id === docId);
          if (idx !== -1) list[idx] = { ...list[idx], ...payload };
          renderApp();
          return docId;
        } else {
          const newId = generateId(colName.slice(0, 3));
          list.unshift({ id: newId, ...payload });
          renderApp();
          return newId;
        }
      } else {
        if (!db) throw new Error("Koneksi Firebase belum siap.");
        if (colName === "pengaturan_sekolah") {
          const targetId = docId || state.pengaturan_sekolah?.id || "profil_utama";
          await setDoc(doc(db, "pengaturan_sekolah", targetId), payload, { merge: true });
          return targetId;
        }
        if (docId) {
          await updateDoc(doc(db, colName, docId), payload);
          return docId;
        } else {
          const ref = await addDoc(collection(db, colName), payload);
          return ref.id;
        }
      }
    }

    async function removeDocument(colName, docId) {
      if (IS_PREVIEW) {
        if (Array.isArray(state[colName])) {
          state[colName] = state[colName].filter((item) => item.id !== docId);
          renderApp();
        }
      } else {
        if (!db) throw new Error("Koneksi Firebase belum siap.");
        await deleteDoc(doc(db, colName, docId));
      }
    }

    async function handleAdminLogin(email, password) {
      if (!email || !password) {
        showToast("Masukkan email dan kata sandi Admin.", "warning");
        return;
      }

      if (IS_PREVIEW) {
        if (email.trim().toLowerCase() === "admin@sekolah.sch.id" && password === "admin123") {
          state.currentUser = {
            role: "admin",
            id: "demo_admin_01",
            name: "Ketua Panitia (Mode Preview)",

            nip: "Admin Ujian"
          };
          showToast("Berhasil masuk sebagai Admin (Mode Preview).", "success");
          renderApp();
        } else {
          showToast("Email atau kata sandi demo tidak sesuai.", "error");
        }
        return;
      }

      try {
        const cred = await signInWithEmailAndPassword(auth, email.trim(), password);
        state.currentUser = {
          role: "admin",
          id: cred.user.uid,
          name: cred.user.displayName || "Admin Panitia Utama",
          emailOrUsername: cred.user.email,
          nip: "Administrator"
        };
        startFirestoreSync();
        showToast("Login Admin berhasil. Selamat bertugas!", "success");
        renderApp();
      } catch (error) {
        let msg = "Gagal masuk. Periksa kembali email dan password Admin.";
        if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
          msg = "Email atau kata sandi Admin tidak terdaftar di Firebase Auth.";
        } else if (error.code === "auth/too-many-requests") {
          msg = "Terlalu banyak percobaan masuk. Coba beberapa saat lagi.";
        }
        showToast(msg, "error");
      }
    }

    async function handlePanitiaLogin(username, password) {
      if (!username || !password) {
        showToast("Masukkan Username/ID dan Password Anda.", "warning");
        return;
      }

      const cleanUser = username.trim();

      if (IS_PREVIEW) {
        const found = state.users_panitia.find(
          (u) => u.username.toLowerCase() === cleanUser.toLowerCase() && u.password === password
        );
        if (!found) {
          showToast("Username atau password tidak ditemukan pada data preview.", "error");
          return;
        }
        if (found.is_active === false) {
          showToast("Akun Anda sedang dinonaktifkan oleh Admin.", "error");
          return;
        }
        state.currentUser = {
          role: found.role || "panitia",
          id: found.id,
          name: found.nama_lengkap,
          emailOrUsername: found.username,
          nip: found.nip_id || "-"
        };
        showToast(`Selamat datang, ${found.nama_lengkap}!`, "success");
        renderApp();
        return;
      }

      try {
        if (!db) throw new Error("Koneksi database belum dikonfigurasi.");
        const snap = await getDocs(collection(db, "users_panitia"));
        let matchedUser = null;
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          if (
            data.username &&
            data.username.toLowerCase() === cleanUser.toLowerCase() &&
            data.password === password
          ) {
            matchedUser = { id: docSnap.id, ...data };
          }
        });

        if (!matchedUser) {
          showToast("Username atau Password tidak valid. Hubungi Admin Panitia.", "error");
          return;
        }
        if (matchedUser.is_active === false) {
          showToast("Akun panitia/pengawas Anda berstatus nonaktif.", "error");
          return;
        }

        state.currentUser = {
          role: matchedUser.role || "panitia",
          id: matchedUser.id,
          name: matchedUser.nama_lengkap,
          emailOrUsername: matchedUser.username,
          nip: matchedUser.nip_id || "-"
        };
        startFirestoreSync();
        showToast(`Berhasil masuk sebagai ${matchedUser.nama_lengkap}`, "success");
        renderApp();
      } catch (error) {
        console.error("Login panitia error:", error);
        showToast("Terjadi kesalahan saat memverifikasi akun ke database.", "error");
      }
    }

    async function handleLogout() {
      if (!IS_PREVIEW && auth && state.currentUser?.role === "admin") {
        try { await signOut(auth); } catch (_) {}
      }
      clearFirestoreListeners();
      state.currentUser = null;
      state.activeMenu = "dashboard";
      state.mobileDrawerOpen = false;
      showToast("Anda telah keluar dari sistem.", "info");
      renderApp();
    }

    function openModal(title, bodyHtml, maxWidthClass = "max-w-lg") {
      const container = document.getElementById("modal-container");
      if (!container) return;
      container.classList.remove("hidden");
      container.classList.add("flex");
      container.innerHTML = `
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} max-h-[88dvh] flex flex-col overflow-hidden fade-in">
          <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">

      const container = document.getElementById("modal-container");

    }

      let totalTercatat = 0;

        Object.values(pMap).forEach((status) => {
          totalTercatat++;

      const persentaseHadir = totalTercatat > 0 ? Math.round((totalSlotHadir / totalTercatat) * 100) : 0;

                          <h3 class="font-display font-bold text-slate-900 text-base mt-2">${escapeHtml(j.mata_pelajaran)}</h3>

            }
          </div>
          <div class="flex-1 text-center">
            <div class="font-display font-extrabold text-base sm:text-lg uppercase tracking-wide text-slate-900">
              ${escapeHtml(s.nama_sekolah || "NAMA SEKOLAH BELUM DIATUR")}

      return `
        <div class="space-y-5 fade-in">
          <!-- Toolbar Pengaturan Cetak -->

                    return `<option value="${b.id}" ${selected ? "selected" : ""}>${escapeHtml(r ? r.kode_ruang : "Ruang")} - ${escapeHtml(j ? j.mata_pelajaran : "Mapel")} (${escapeHtml(b.submitted_at || "")})</option>`;

          </div>
        </div>

      const ruangList = filterByActivePeriod(state.ruang_ujian);
      const allPeserta = filterByActivePeriod(state.peserta_ujian);
      const jadwalList = filterByActivePeriod(state.jadwal_ujian);

      const filteredPeserta =
        state.cetakFilterRuang === "ALL"
          ? allPeserta

      if (state.cetakDocType === "kartu") {
        if (filteredPeserta.length === 0) {
          return `<div class="text-center py-12 text-sm text-slate-500">Tidak ada data peserta untuk dicetak pada filter ruang ini.</div>`;
        }
        return `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filteredPeserta.map((p) => {
              const ruang = getRuangById(p.ruang_id);
              return `
                <div class="border-2 border-slate-800 rounded-xl p-3.5 bg-white avoid-break flex flex-col justify-between">

                      ${s.logo_sekolah
                        ? `<img src="${s.logo_sekolah}" alt="Logo" class="w-full h-full object-contain" />`

                      <tr><td class="text-slate-500">Nama Siswa</td><td class="font-bold uppercase">: ${escapeHtml(p.nama_siswa)}</td></tr>

                      <tr><td class="text-slate-500">Ruang Ujian</td><td class="font-semibold">: ${escapeHtml(ruang ? `${ruang.kode_ruang} (${ruang.nama_ruang})` : "-")}</td></tr>

                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      if (state.cetakDocType === "hadir") {
        const targetRuang = state.cetakFilterRuang !== "ALL" ? getRuangById(state.cetakFilterRuang) : null;

          </label>
          <div class="flex justify-end gap-2 pt-3">

          </div>
        </form>
        `
      );
      document.getElementById("form-modal-periode").onsubmit = async (e) => {
        e.preventDefault();
        const jenis = document.getElementById("mp-jenis").value.trim();
        const semester = document.getElementById("mp-semester").value;
        const tahun = document.getElementById("mp-tahun").value.trim();
        const isActive = document.getElementById("mp-active").checked;

        await saveDocument("master_periode", {
          jenis_penilaian: jenis,
          semester,
          tahun_pelajaran: tahun,
          is_active: isActive,
          updated_at: new Date().toISOString()

          state.filter.jenis_penilaian = jenis;
          state.filter.semester = semester;
          state.filter.tahun_pelajaran = tahun;
        }
        closeModal();
        showToast("Periode penilaian berhasil ditambahkan.", "success");
        renderApp();
      };

        const allJadwal = filterByActivePeriod(state.jadwal_ujian).filter((j) => j.id !== existing?.id);

        if (bentrokRuang) {
          const box = document.getElementById("jadwal-conflict-alert");

      }

      const firstJ = jadwalList[0];
      const siswaAwal = filterByActivePeriod(state.peserta_ujian).filter((p) => p.ruang_id === firstJ.ruang_id);
      const pMapAwal = firstJ.presensi_map || {};
      const hadirAwal = siswaAwal.filter((s) => (pMapAwal[s.id] || "Hadir") === "Hadir").length;

      openModal(
        "Formulir Berita Acara Pelaksanaan Ujian",
        `

                const r = getRuangById(j.ruang_id);
                return `<option value="${j.id}">${escapeHtml(r ? r.kode_ruang : "Ruang")} - ${escapeHtml(j.mata_pelajaran)} (${escapeHtml(j.tanggal)} • ${escapeHtml(j.sesi)})</option>`;

          </div>

          <div class="grid grid-cols-3 gap-2.5">
            <div>

                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold" />

            <div>
              <label class="block text-[11px] font-semibold text-emerald-700 mb-1">Hadir</label>
              <input type="number" id="mbap-hadir" required min="0" value="${hadirAwal}"

            </div>
            <div>
              <label class="block text-[11px] font-semibold text-rose-700 mb-1">Tidak Hadir</label>
              <input type="number" id="mbap-absen" required min="0" value="${Math.max(0, siswaAwal.length - hadirAwal)}"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold text-rose-600" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Rincian Nomor / Nama Peserta Tidak Hadir</label>
            <input type="text" id="mbap-daftar-absen" value="Nihil" placeholder="Contoh: 26-01-001-005 (Sakit)"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-teal-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Kelengkapan Naskah Soal / Token Ujian</label>
            <input type="text" id="mbap-naskah" value="Lengkap / Token Aktif"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-teal-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Catatan Kejadian Khusus / Tata Tertib *</label>
            <textarea id="mbap-catatan" rows="3" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-teal-500">Pelaksanaan ujian berjalan tertib, aman, dan lancar tanpa kendala.</textarea>
          </div>

          <div class="flex justify-end gap-2 pt-3">
            <button type="button" onclick="document.getElementById('modal-close-btn').click()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-semibold">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-semibold">Simpan Berita Acara</button>
          </div>
        </form>
        `
      );

      document.getElementById("mbap-jadwal").onchange = (e) => {
        const j = getJadwalById(e.target.value);
        if (!j) return;
        const siswaList = filterByActivePeriod(state.peserta_ujian).filter((p) => p.ruang_id === j.ruang_id);
        const pMap = j.presensi_map || {};
        const hadir = siswaList.filter((s) => (pMap[s.id] || "Hadir") === "Hadir").length;
        const absenList = siswaList.filter((s) => pMap[s.id] && pMap[s.id] !== "Hadir");

        document.getElementById("mbap-seharusnya").value = siswaList.length;
        document.getElementById("mbap-hadir").value = hadir;
        document.getElementById("mbap-absen").value = Math.max(0, siswaList.length - hadir);
        document.getElementById("mbap-daftar-absen").value =
          absenList.length > 0

      };

      document.getElementById("form-modal-bap").onsubmit = async (e) => {
        e.preventDefault();
        const jadwalId = document.getElementById("mbap-jadwal").value;
        const jadwal = getJadwalById(jadwalId);
        await saveDocument("berita_acara", {
          jadwal_id: jadwalId,
          ruang_id: jadwal ? jadwal.ruang_id : "",
          jml_seharusnya: Number(document.getElementById("mbap-seharusnya").value) || 0,
          jml_hadir: Number(document.getElementById("mbap-hadir").value) || 0,
          jml_tidak_hadir: Number(document.getElementById("mbap-absen").value) || 0,
          daftar_absen: document.getElementById("mbap-daftar-absen").value.trim(),
          jumlah_naskah: document.getElementById("mbap-naskah").value.trim(),
          catatan_kejadian: document.getElementById("mbap-catatan").value.trim(),
          pengawas_nama: jadwal?.nama_pengawas || state.currentUser?.name || "-",
          submitted_at: new Date().toLocaleString("id-ID"),
          jenis_penilaian: state.filter.jenis_penilaian,
          semester: state.filter.semester,
          tahun_pelajaran: state.filter.tahun_pelajaran
        });
        closeModal();
        showToast("Berita Acara Pelaksanaan Ujian berhasil disimpan.", "success");
      };
    }

    function renderApp() {
      const root = document.getElementById("sim-ujian-root");
      if (!root) return;

      if (state.authLoading) {
        root.innerHTML = `
          <div class="min-h-full flex flex-col items-center justify-center p-6 text-center">
            <div class="w-12 h-12 rounded-2xl border-4 border-teal-200 border-t-teal-600 animate-spin mb-4"></div>
            <p class="font-display font-bold text-slate-800 text-sm">Memuat Sistem Manajemen Ujian...</p>
          </div>
        `;
        return;
      }

      if (!state.currentUser) {
        root.innerHTML = renderLoginScreen();
        bindLoginEvents();
        if (window.lucide) lucide.createIcons();
        return;
      }

      let activeContent = "";
      switch (state.activeMenu) {
        case "dashboard":
          activeContent = renderDashboardView();
          break;
        case "master":
          activeContent = renderMasterView();
          break;
        case "jadwal":
          activeContent = renderJadwalView();
          break;
        case "monitoring":
          activeContent = renderMonitoringView();
          break;
        case "bap":
          activeContent = renderBapView();
          break;
        case "cetak":
          activeContent = renderCetakView();
          break;
        case "akun":
          activeContent = renderAkunPanitiaView();
          break;
        default:
          activeContent = renderDashboardView();
      }

      root.innerHTML = `
        <div class="min-h-full flex flex-col lg:pl-72 pb-24 lg:pb-10">
          ${renderSidebar()}
          ${renderTopFilterBar()}
          <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-5 sm:pt-6">
            ${activeContent}
          </main>
          ${renderMobileBottomNav()}
        </div>
      `;

      bindAppEvents();
      if (window.lucide) lucide.createIcons();
    }

    function bindLoginEvents() {
      document.querySelectorAll("[data-login-tab]").forEach((btn) => {
        btn.onclick = () => {
          state.loginTab = btn.getAttribute("data-login-tab");
          renderApp();
        };
      });

      document.getElementById("btn-toggle-pwd")?.addEventListener("click", () => {
        state.showPassword = !state.showPassword;
        renderApp();
      });

      const formAdmin = document.getElementById("form-login-admin");
      if (formAdmin) {
        formAdmin.onsubmit = (e) => {
          e.preventDefault();
          handleAdminLogin(
            document.getElementById("login-admin-email").value,
            document.getElementById("login-admin-password").value
          );
        };
      }

      const formPanitia = document.getElementById("form-login-panitia");
      if (formPanitia) {
        formPanitia.onsubmit = (e) => {
          e.preventDefault();
          handlePanitiaLogin(
            document.getElementById("login-panitia-username").value,
            document.getElementById("login-panitia-password").value
          );
        };
      }
    }

    function bindAppEvents() {
      // Navigasi Menu
      document.querySelectorAll("[data-nav-menu]").forEach((btn) => {
        btn.onclick = () => {
          state.activeMenu = btn.getAttribute("data-nav-menu");
          state.mobileDrawerOpen = false;
          state.searchQuery = "";
          renderApp();
        };
      });

      // Toggle Mobile Drawer
      document.getElementById("btn-toggle-mobile-drawer")?.addEventListener("click", () => {
        state.mobileDrawerOpen = !state.mobileDrawerOpen;
        renderApp();
      });
      document.getElementById("mobile-drawer-backdrop")?.addEventListener("click", () => {
        state.mobileDrawerOpen = false;
        renderApp();
      });

      // Logout
      document.getElementById("btn-logout-desktop")?.addEventListener("click", handleLogout);
      document.getElementById("btn-logout-mobile")?.addEventListener("click", handleLogout);

      // 3 Global Dropdown Filter
      document.getElementById("global-jenis-penilaian")?.addEventListener("change", (e) => {
        state.filter.jenis_penilaian = e.target.value;
        renderApp();
      });
      document.getElementById("global-semester")?.addEventListener("change", (e) => {
        state.filter.semester = e.target.value;
        renderApp();
      });
      document.getElementById("global-tahun-pelajaran")?.addEventListener("change", (e) => {
        state.filter.tahun_pelajaran = e.target.value;
        renderApp();
      });

      // Master Sub-Tabs
      document.querySelectorAll("[data-master-tab]").forEach((btn) => {
        btn.onclick = () => {
          state.masterSubTab = btn.getAttribute("data-master-tab");
          state.searchQuery = "";
          renderApp();
        };
      });

      // Unggah & Simpan Profil + Logo Sekolah
      document.getElementById("file-logo-sekolah")?.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 260, 260, 0.85);
          document.getElementById("input-logo-base64").value = dataUrl;
          document.getElementById("preview-logo-wrapper").innerHTML = `<img src="${dataUrl}" alt="Logo" class="w-full h-full object-contain p-2" />`;
          showToast("Logo sekolah siap disimpan.", "success");
        } catch (err) {
          showToast(err.message, "error");
        }
      });

      document.getElementById("btn-hapus-logo")?.addEventListener("click", () => {
        document.getElementById("input-logo-base64").value = "";
        document.getElementById("preview-logo-wrapper").innerHTML = `<div class="text-slate-400 text-[11px]">Logo dihapus</div>`;
      });

      document.getElementById("form-profil-sekolah")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        await saveDocument("pengaturan_sekolah", {
          nama_sekolah: document.getElementById("sek-nama").value.trim(),
          npsn: document.getElementById("sek-npsn").value.trim(),
          alamat: document.getElementById("sek-alamat").value.trim(),
          kota: document.getElementById("sek-kota").value.trim(),
          ketua_panitia: document.getElementById("sek-ketua").value.trim(),
          nip_ketua: document.getElementById("sek-nip").value.trim(),
          logo_sekolah: document.getElementById("input-logo-base64").value,
          updated_at: new Date().toISOString()
        });
        showToast("Profil dan logo sekolah berhasil disimpan.", "success");
      });

      // Master Periode CRUD
      document.getElementById("btn-add-periode")?.addEventListener("click", openPeriodeModal);
      document.querySelectorAll("[data-activate-periode]").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-activate-periode");
          const target = state.master_periode.find((p) => p.id === id);
          if (!target) return;
          for (const p of state.master_periode) {
            await saveDocument("master_periode", { is_active: p.id === id }, p.id);
          }
          state.filter.jenis_penilaian = target.jenis_penilaian;
          state.filter.semester = target.semester;
          state.filter.tahun_pelajaran = target.tahun_pelajaran;
          showToast("Periode aktif diperbarui.", "success");
          renderApp();
        };
      });
      document.querySelectorAll("[data-delete-periode]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-periode");
          confirmAction("Hapus Periode", "Yakin ingin menghapus referensi periode ini?", async () => {
            await removeDocument("master_periode", id);
            showToast("Periode berhasil dihapus.", "success");
          });
        };
      });

      // Master Ruang CRUD
      document.getElementById("btn-add-ruang")?.addEventListener("click", () => openRuangModal(null));
      document.querySelectorAll("[data-edit-ruang]").forEach((btn) => {
        btn.onclick = () => {
          const r = getRuangById(btn.getAttribute("data-edit-ruang"));
          if (r) openRuangModal(r);
        };
      });
      document.querySelectorAll("[data-delete-ruang]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-ruang");
          confirmAction("Hapus Ruang Ujian", "Hapus ruang ujian ini dari periode aktif?", async () => {
            await removeDocument("ruang_ujian", id);
            showToast("Ruang ujian dihapus.", "success");
          });
        };
      });

      // Master Peserta CRUD & Search
      document.getElementById("search-peserta-input")?.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        renderApp();
        const inputEl = document.getElementById("search-peserta-input");
        if (inputEl) {
          inputEl.focus();
          inputEl.setSelectionRange(pos, pos);
        }
      });
      document.getElementById("btn-add-peserta")?.addEventListener("click", () => openPesertaModal(null));
      document.querySelectorAll("[data-edit-peserta]").forEach((btn) => {
        btn.onclick = () => {
          const p = state.peserta_ujian.find((x) => x.id === btn.getAttribute("data-edit-peserta"));
          if (p) openPesertaModal(p);
        };
      });
      document.querySelectorAll("[data-delete-peserta]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-peserta");
          confirmAction("Hapus Peserta", "Hapus data peserta ujian beserta fotonya?", async () => {
            await removeDocument("peserta_ujian", id);
            showToast("Data peserta dihapus.", "success");
          });
        };
      });

      // Jadwal & Plotting Pengawas CRUD
      document.getElementById("btn-add-jadwal")?.addEventListener("click", () => openJadwalModal(null));
      document.querySelectorAll("[data-edit-jadwal]").forEach((btn) => {
        btn.onclick = () => {
          const j = getJadwalById(btn.getAttribute("data-edit-jadwal"));
          if (j) openJadwalModal(j);
        };
      });
      document.querySelectorAll("[data-delete-jadwal]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-jadwal");
          confirmAction("Hapus Jadwal", "Hapus jadwal ujian ini?", async () => {
            await removeDocument("jadwal_ujian", id);
            showToast("Jadwal ujian dihapus.", "success");
          });
        };
      });

      // Monitoring Ruang & Presensi
      document.querySelectorAll("[data-status-jadwal]").forEach((sel) => {
        sel.onchange = async () => {
          const id = sel.getAttribute("data-status-jadwal");
          await saveDocument("jadwal_ujian", { status_ruang: sel.value }, id);
          showToast(`Status ruang diubah menjadi "${sel.value}".`, "success");
        };
      });
      document.querySelectorAll("[data-open-presensi]").forEach((btn) => {
        btn.onclick = () => {
          const j = getJadwalById(btn.getAttribute("data-open-presensi"));
          if (j) openPresensiModal(j);
        };
      });

      // Berita Acara (BAP)
      document.getElementById("btn-add-bap")?.addEventListener("click", openBapModal);
      document.querySelectorAll("[data-print-bap]").forEach((btn) => {
        btn.onclick = () => {
          state.cetakFilterBapId = btn.getAttribute("data-print-bap");
          state.cetakDocType = "bap";
          state.activeMenu = "cetak";
          renderApp();
        };
      });
      document.querySelectorAll("[data-delete-bap]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-bap");
          confirmAction("Hapus Berita Acara", "Hapus dokumen Berita Acara ini?", async () => {
            await removeDocument("berita_acara", id);
            showToast("Berita Acara dihapus.", "success");
          });
        };
      });

      // Pusat Cetak
      document.querySelectorAll("[data-cetak-doc]").forEach((btn) => {
        btn.onclick = () => {
          state.cetakDocType = btn.getAttribute("data-cetak-doc");
          renderApp();
        };
      });
      document.getElementById("cetak-filter-ruang")?.addEventListener("change", (e) => {
        state.cetakFilterRuang = e.target.value;
        renderApp();
      });
      document.getElementById("cetak-filter-bap")?.addEventListener("change", (e) => {
        state.cetakFilterBapId = e.target.value;
        renderApp();
      });
      document.getElementById("btn-trigger-print")?.addEventListener("click", () => {
        window.print();
      });

      // Manajemen Akun Panitia (Admin)
      document.getElementById("btn-add-akun")?.addEventListener("click", () => openAkunModal(null));
      document.querySelectorAll("[data-edit-akun]").forEach((btn) => {
        btn.onclick = () => {
          const u = state.users_panitia.find((x) => x.id === btn.getAttribute("data-edit-akun"));
          if (u) openAkunModal(u);
        };
      });
      document.querySelectorAll("[data-delete-akun]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-delete-akun");
          confirmAction("Hapus Akun Petugas", "Yakin ingin menghapus akun petugas ini?", async () => {
            await removeDocument("users_panitia", id);
            showToast("Akun petugas berhasil dihapus.", "success");
          });
        };
      });
    }

    // Inisialisasi Render Pertama
    renderApp();
  </script>
</body>
</html>
